# 平台基础配置
ruoyi:
  # 名称
  name: 工程数据驾驶舱
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径默认相对当前工作目录；共享环境通过 RUOYI_PROFILE 注入持久化目录。
  profile: ${RUOYI_PROFILE:./uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  # 生产和共享环境必须通过 TOKEN_SECRET 注入固定高强度密钥；未配置时仅生成本次启动有效的随机值
  secret: ${TOKEN_SECRET:${random.uuid}${random.uuid}}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 轻量大屏数据集配置。仅允许服务端登记的数据源，浏览器不接触数据库凭证。
dashboard:
  integration:
    credential-env-allowlist: ${DASHBOARD_INTEGRATION_CREDENTIAL_ENV_ALLOWLIST:}
    credentials-directory: ${DASHBOARD_INTEGRATION_CREDENTIALS_DIRECTORY:}
    audit-retention-days: ${DASHBOARD_INTEGRATION_AUDIT_RETENTION_DAYS:30}
    scanner:
      host: ${DASHBOARD_INTEGRATION_SCANNER_HOST:}
      port: ${DASHBOARD_INTEGRATION_SCANNER_PORT:3310}
      timeout-seconds: ${DASHBOARD_INTEGRATION_SCANNER_TIMEOUT_SECONDS:10}
    # 本机/局域网开发目标默认拒绝；公网 HTTP 使用来源级 PUBLIC_HTTP 与主机、端口白名单。
    allow-local-development-targets: ${DASHBOARD_INTEGRATION_ALLOW_LOCAL_DEVELOPMENT_TARGETS:false}
    # 保留专网明文/隔离测试开关；PUBLIC_HTTP 不依赖此开关，PUBLIC_HTTPS 始终要求 HTTPS。
    allow-plain-http: ${DASHBOARD_INTEGRATION_ALLOW_PLAIN_HTTP:false}
    recovery-interval-seconds: ${DASHBOARD_INTEGRATION_RECOVERY_INTERVAL_SECONDS:30}
    retention-cleanup-interval-seconds: ${DASHBOARD_INTEGRATION_RETENTION_CLEANUP_INTERVAL_SECONDS:300}
  datasource:
    # 数据源管理页保存的密码/令牌使用该密钥加密；生产环境必须通过密钥服务或环境变量注入。
    encryption-key: ${DASHBOARD_DATASOURCE_ENCRYPTION_KEY:}
    labor:
      url: ${LABOR_MYSQL_URL:jdbc:mysql://${LABOR_MYSQL_HOST:127.0.0.1}:${LABOR_MYSQL_PORT:3306}/${LABOR_MYSQL_DATABASE:labor}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      username: ${LABOR_MYSQL_USERNAME:root}
      password: ${LABOR_MYSQL_PASSWORD:}
  api:
    allowed-hosts: ${DASHBOARD_API_ALLOWED_HOSTS:127.0.0.1,localhost}
    labor:
      # 外部 API 的地址、JWT 和项目编码只从环境变量/密钥服务注入。
      base-url: ${LABOR_API_BASE_URL:}
      token: ${LABOR_API_TOKEN:}
      project-code: ${LABOR_PROJECT_CODE:}
      endpoints:
        hik-events: ${LABOR_API_HIK_EVENTS_PATH:/api/labor/admin/hik/events}
        hik-organizations: ${LABOR_API_HIK_ORGANIZATIONS_PATH:/api/labor/admin/hik/organization-options}
        attendance-daily: ${LABOR_API_ATTENDANCE_DAILY_PATH:/api/labor/admin/attendance-statistics/daily}
        dashboard: ${LABOR_API_DASHBOARD_PATH:/api/labor/admin/dashboard}
  websocket:
    allowed-origin: ${DASHBOARD_WEBSOCKET_ALLOWED_ORIGIN:http://127.0.0.1:5173,http://localhost:5173}
    # 上游 WebSocket 主机白名单；生产环境必须显式配置，不能把浏览器来源白名单当作上游白名单。
    allowed-hosts: ${DASHBOARD_WEBSOCKET_ALLOWED_HOSTS:127.0.0.1,localhost}
